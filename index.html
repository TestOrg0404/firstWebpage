<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Site</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    line-height: 1.6;
  }
  header {
    padding: 80px 20px;
    text-align: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
  }
  header h1 {
    font-size: 2.5rem;
    margin-bottom: 12px;
  }
  header p {
    color: #94a3b8;
    font-size: 1.1rem;
  }
  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    margin-bottom: 8px;
    color: #38bdf8;
  }
  footer {
    text-align: center;
    padding: 30px;
    color: #64748b;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>Hello, I'm Irene 👋</h1>
  <p>Welcome to my very first website.</p>
</header>

<main>
  <div class="card">
    <h2>About</h2>
    <p>This is a simple page I built and published myself using GitHub Pages.</p>
  </div>

  <div class="card">
    <h2>Contact</h2>
    <p>Email: accounting@enovativegroup.com</p>
  </div>
</main>

<footer>
  &copy; 2026 My Site. Built with GitHub Pages.
</footer>

</body>
</html>
